# Enabling unitTests.isIncludeAndroidResources lets Robolectric read the merged manifest, which
# would otherwise make every unit test instantiate AppWatcherApplication and call startKoin() a
# second time (KoinApplicationAlreadyStartedException). Unit tests wire their own dependencies, so
# keep the plain framework Application as the default. A test that genuinely needs the real
# application can still opt in with @Config(application = AppWatcherApplication::class).
application=android.app.Application